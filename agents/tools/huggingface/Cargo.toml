[package]
name = "core-agent-huggingface"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Authenticated Hugging Face model repository downloads"
license = "MIT"

[lib]
name = "core_agent_huggingface"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
